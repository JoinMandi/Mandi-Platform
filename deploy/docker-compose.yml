# Production compose file used on the EC2 instance.
# The image tag is written by /opt/mandi/deploy.sh.
services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file:
      - /opt/mandi/.env
    expose:
      - "3000"
    logging:
      driver: awslogs
      options:
        awslogs-region: af-south-1
        awslogs-group: /mandi/staging/app
        awslogs-stream: app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
