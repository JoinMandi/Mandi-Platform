name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mandi_admin
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: mandi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandi_admin -d mandi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mandi_admin:localdev@localhost:5432/mandi
      DATABASE_APP_URL: postgres://mandi_app:localdev@localhost:5432/mandi
      DATABASE_SERVICE_URL: postgres://mandi_service:localdev@localhost:5432/mandi
      DATABASE_APP_PASSWORD: localdev
      DATABASE_SERVICE_PASSWORD: localdev
      DATABASE_SSL: "false"
      TEST_DATABASE_URL: postgres://mandi_admin:localdev@localhost:5432/mandi
      TEST_APP_DATABASE_URL: postgres://mandi_app:localdev@localhost:5432/mandi
      TEST_SERVICE_DATABASE_URL: postgres://mandi_service:localdev@localhost:5432/mandi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:provision
      - run: npm run db:migrate
      - run: npm run db:rollback -- --count 100
      - run: npm run db:migrate
      - run: npm run test:db

  infrastructure:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  container:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: mandi:ci
